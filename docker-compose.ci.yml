services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: geoguide_e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d geoguide_e2e"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=app_user
      - DB_PASSWORD=app_password
      - DB_NAME=geoguide_e2e
      - DB_SSLMODE=disable
      - APP_PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - test-net
    command: ["./geoguide_api", "-config", "config/config.yaml"]

  tester:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - APP_URL=http://app:8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=app_user
      - DB_PASSWORD=app_password
      - DB_NAME=geoguide_e2e
    depends_on:
      app:
        condition: service_started
    networks:
      - test-net
    command:
      - sh
      - -c
      - |
        set -e
        echo "=== UNIT TESTS ==="
        go test -v ./internal/usecase/... ./internal/repository/...

        echo "=== INTEGRATION TESTS ==="
        go test -v -tags=integration -p 1 \
          -coverprofile=/app/coverage/coverage.out \
          ./internal/repository/... ./internal/usecase/...

        echo "=== E2E TESTS ==="
        go test -v -timeout 10m ./internal/e2e/...

        echo "=== REPORT ==="
        mkdir -p /app/coverage /app/allure-results
        go-junit-report < /app/coverage/coverage.out > /app/allure-results/junit-report.xml
        gocov convert /app/coverage/coverage.out > /app/coverage/coverage.json

        echo "=== ALL TESTS PASSED ==="
    volumes:
      - ./coverage:/app/coverage
      - ./allure-results:/app/allure-results

networks:
  test-net:
    driver: bridge