name: GeoGuide Test Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test-and-report:
    name: Run Integration & E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Application Image
        run: |
          echo "Building GeoGuide API image..."
          docker build -t geoguide-app:ci -f Dockerfile .
          echo " App image built successfully"

      - name: Run Test Docker Environment (App + Postgres + Tester)
        run: |
          echo "Starting docker-compose.ci.yml..."
          echo "This will start: 1) Postgres, 2) GeoGuide App, 3) E2E Tester"
          make test-ci
        continue-on-error: false

      - name: Cache Allure History
        uses: actions/cache@v4
        with:
          path: ./allure-results/history
          key: allure-history-${{ github.run_id }}
          restore-keys: |
            allure-history-

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: ./allure-results/
          retention-days: 7

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ./coverage/
          retention-days: 7

      - name: Publish Allure Report
        uses: simple-elf/allure-report-action@v1.11
        if: always()
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          allure_results: ./allure-results
          allure_report: allure-report
          allure_history: allure-history
