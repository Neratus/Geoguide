version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: geoguide_e2e
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d geoguide_e2e"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack-test:
    image: localstack/localstack:3.0.2
    environment:
      - SERVICES=s3
      - DEBUG=1
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  seaweedfs-test:
    image: chrislusf/seaweedfs:latest
    command: >
      server
      -dir=/data
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3-config.json
    ports:
      - "8333:8333"
    volumes:
      - ./seaweedfs-s3-config.json:/etc/seaweedfs/s3-config.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8333/"]
      interval: 5s
      timeout: 5s
      retries: 10
      
  tester:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      localstack-test:
        condition: service_healthy
    environment:
      - DB_HOST=postgres-test
      - DB_PORT=5432
      - DB_NAME=geoguide_e2e
      - DB_USER=app_user
      - DB_PASSWORD=app_password
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - LOCALSTACK_HOST=localstack-test:4566
      - TEST_MODE=safe
      - S3_ENDPOINT=http://seaweedfs-test:8333
      - S3_ACCESS_KEY=any
      - S3_SECRET_KEY=any
      - S3_BUCKET=static
      - S3_USE_SSL=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./allure-results:/app/allure-results
      - ./coverage:/app/coverage
    command: >
      sh -c "
      echo 'Running Integration tests...' &&
      go test -v -tags=postgres -p 1 -coverprofile=/app/coverage/coverage.out ./internal/repository/... ./internal/usecase/... &&
      echo 'Running E2E tests...' &&
      go test -v -timeout 10m ./internal/e2e/... &&
      echo 'Generating reports...' &&
      gocov convert /app/coverage/coverage.out | gocov report > /app/coverage/coverage.txt &&
      go-junit-report < /app/coverage/coverage.out > /app/allure-results/junit-report.xml &&
      allure generate /app/allure-results -o /app/allure-results/allure-report --clean &&
      echo 'Done!'
      "