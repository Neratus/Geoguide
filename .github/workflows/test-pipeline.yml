name: GeoGuide Test Pipeline

on:
  push:
    branches: [main, master, develop, maib]
  pull_request:
    branches: [main, master, develop, maib]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Build application
        run: go build -v ./...

  # ==================== UNIT ====================
  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Add GOPATH bin to PATH
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Install golurectl
        run: go install github.com/robotomize/go-allure/cmd/golurectl@latest
      - name: Start test infrastructure
        run: |
          docker compose -f docker-compose.yml --profile postgres --profile redis up -d postgres redis seaweedfs
          echo "Waiting for Postgres..."
          for i in $(seq 1 30); do
            docker compose -f docker-compose.yml exec -T postgres pg_isready -U app_user -d dev && break
            sleep 2
          done
          echo "Waiting for Redis..."
          for i in $(seq 1 30); do
            docker compose -f docker-compose.yml exec -T redis redis-cli ping && break
            sleep 2
          done
          echo "Waiting for SeaweedFS S3 port 8333..."
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/8333) 2>/dev/null; then
              exec 3<&- 3>&-
              echo "SeaweedFS port 8333 is open"
              break
            fi
            sleep 2
          done
          echo "--- Containers ---"
          docker compose -f docker-compose.yml ps
      - name: Run Unit Tests
        run: |
          mkdir -p allure/results/unit coverage
          make test-unit
      - name: Debug - list unit results
        if: always()
        run: |
          echo "=== Files in allure/results/unit ==="
          ls -la allure/results/unit/ || true
          echo "=== Count of Allure JSON files ==="
          ls -1 allure/results/unit/*.json 2>/dev/null | wc -l || echo "no JSON files"
          echo "=== Sample of result files ==="
          head -c 500 allure/results/unit/*-result.json 2>/dev/null || true
      - name: Show coverage
        if: always()
        run: |
          if [ -f coverage/coverage-unit.out ]; then
            echo "=== Unit coverage summary ==="
            go tool cover -func=coverage/coverage-unit.out | tail -n 1
          else
            echo "!! coverage/coverage-unit.out not found"
          fi
      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-unit
          path: allure/results/unit/
          retention-days: 1
          if-no-files-found: warn
      - name: Upload Unit Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/coverage-unit.out
          retention-days: 7
          if-no-files-found: warn
      - name: Collect docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color
      - name: Stop infrastructure
        if: always()
        run: docker compose -f docker-compose.yml down -v

  # ================ INTEGRATION =================
  integration-tests:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Add GOPATH bin to PATH
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Install golurectl
        run: go install github.com/robotomize/go-allure/cmd/golurectl@latest
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Start test infrastructure
        run: |
          docker compose -f docker-compose.yml --profile postgres --profile redis up -d postgres redis seaweedfs
          echo "Waiting for Postgres..."
          for i in $(seq 1 30); do
            docker compose -f docker-compose.yml exec -T postgres pg_isready -U app_user -d dev && break
            sleep 2
          done
          echo "Waiting for Redis..."
          for i in $(seq 1 30); do
            docker compose -f docker-compose.yml exec -T redis redis-cli ping && break
            sleep 2
          done
          echo "Waiting for SeaweedFS S3 port 8333..."
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/8333) 2>/dev/null; then
              exec 3<&- 3>&-
              echo "SeaweedFS port 8333 is open"
              break
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml ps
      - name: Run Integration Tests
        run: |
          mkdir -p allure/results/integration coverage
          make test-integration
      - name: Debug - list integration results
        if: always()
        run: |
          echo "=== Files in allure/results/integration ==="
          ls -la allure/results/integration/ || true
          echo "=== Count of Allure JSON files ==="
          ls -1 allure/results/integration/*.json 2>/dev/null | wc -l || echo "no JSON files"
      - name: Show coverage
        if: always()
        run: |
          if [ -f coverage/coverage-integration.out ]; then
            echo "=== Integration coverage summary ==="
            go tool cover -func=coverage/coverage-integration.out | tail -n 1
          else
            echo "!! coverage/coverage-integration.out not found"
          fi
      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-integration
          path: allure/results/integration/
          retention-days: 1
          if-no-files-found: warn
      - name: Upload Integration Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage/coverage-integration.out
          retention-days: 7
          if-no-files-found: warn
      - name: Collect docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color
      - name: Stop infrastructure
        if: always()
        run: docker compose -f docker-compose.yml down -v

  # ==================== E2E =====================
  e2e-tests:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Add GOPATH bin to PATH
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Install golurectl
        run: go install github.com/robotomize/go-allure/cmd/golurectl@latest
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Start test infrastructure
        run: |
          docker compose -f docker-compose.yml --profile postgres --profile redis up -d postgres redis seaweedfs
          echo "Waiting for Postgres..."
          for i in $(seq 1 30); do
            docker compose -f docker-compose.yml exec -T postgres pg_isready -U app_user -d dev && break
            sleep 2
          done
          echo "Waiting for Redis..."
          for i in $(seq 1 30); do
            docker compose -f docker-compose.yml exec -T redis redis-cli ping && break
            sleep 2
          done
          echo "Waiting for SeaweedFS S3 port 8333..."
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/8333) 2>/dev/null; then
              exec 3<&- 3>&-
              echo "SeaweedFS port 8333 is open"
              break
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml ps
      - name: Build and start application
        run: |
          go build -o /tmp/geoguide_api ./cmd/api
          nohup /tmp/geoguide_api -config config/config.yaml > /tmp/app.log 2>&1 &
          echo "Waiting for app on :8080 ..."
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/8080) 2>/dev/null; then
              echo "App is up"
              break
            fi
            sleep 2
          done
          echo "--- App startup log ---"
          cat /tmp/app.log || true
      - name: Run E2E Tests
        env:
          APP_URL: http://127.0.0.1:8080
          DB_HOST: 127.0.0.1
          DB_PORT: "5433"
          DB_USER: app_user
          DB_PASSWORD: your_secure_password
          DB_NAME: dev
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
          S3_ENDPOINT: http://127.0.0.1:8333
        run: |
          mkdir -p allure/results/e2e coverage
          make test-e2e
      - name: Debug - list e2e results
        if: always()
        run: |
          echo "=== Files in allure/results/e2e ==="
          ls -la allure/results/e2e/ || true
          echo "=== Count of Allure JSON files ==="
          ls -1 allure/results/e2e/*.json 2>/dev/null | wc -l || echo "no JSON files"
      - name: Show coverage
        if: always()
        run: |
          if [ -f coverage/coverage-e2e.out ]; then
            echo "=== E2E coverage summary ==="
            go tool cover -func=coverage/coverage-e2e.out | tail -n 1
          else
            echo "!! coverage/coverage-e2e.out not found"
          fi
      - name: Upload E2E Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e
          path: allure/results/e2e/
          retention-days: 1
          if-no-files-found: warn
      - name: Upload E2E Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-e2e
          path: coverage/coverage-e2e.out
          retention-days: 7
          if-no-files-found: warn
      - name: Collect app and docker logs on failure
        if: failure()
        run: |
          echo "=== App log ==="
          cat /tmp/app.log || true
          echo "=== Docker logs ==="
          docker compose -f docker-compose.yml logs --no-color || true
      - name: Stop infrastructure
        if: always()
        run: docker compose -f docker-compose.yml down -v

  # ================= SUMMARY ====================
  test-summary:
    name: Test Summary
    needs: [unit-tests, integration-tests, e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: test-results
      - name: Generate Test Summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: "test-results/**/*.xml"
          show: "all"

  # ============== REPORT & DEPLOY ===============
  report-and-deploy:
    name: Allure Report & Deploy
    needs: [unit-tests, integration-tests, e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Get previous run ID
        id: prev-run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKFLOW_FILE="test-pipeline.yml"
          API="/repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FILE}/runs?per_page=20"
          RUN_ID=$(gh api "$API" \
            --jq '[.workflow_runs[] | select(.status=="completed" and .conclusion!="cancelled")][0].id' \
            2>/dev/null || echo "")
          if [ "$RUN_ID" = "${{ github.run_id }}" ]; then
            RUN_ID=$(gh api "$API" \
              --jq '[.workflow_runs[] | select(.status=="completed" and .conclusion!="cancelled")][1].id' \
              2>/dev/null || echo "")
          fi
          case "$RUN_ID" in
            ''|*[!0-9]*) RUN_ID="" ;;
          esac
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Previous run ID: [$RUN_ID]"

      # ---------- Allure артефакты ----------
      - name: Download unit Allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-unit
          path: allure/results/unit

      - name: Download integration Allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-integration
          path: allure/results/integration

      - name: Download e2e Allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-e2e
          path: allure/results/e2e

      # ---------- Coverage артефакты ----------
      - name: Download unit coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-unit
          path: coverage

      - name: Download integration coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-integration
          path: coverage

      - name: Download e2e coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-e2e
          path: coverage

      # ---------- История Allure ----------
      - name: Download previous Allure history
        if: steps.prev-run.outputs.run_id != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-history
          path: allure-history
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.prev-run.outputs.run_id }}

      - name: Prepare history
        run: |
          mkdir -p allure/results/history
          if [ -d "allure-history" ] && [ "$(ls -A allure-history 2>/dev/null)" ]; then
            cp -r allure-history/. allure/results/history/
            echo "History copied to allure/results/history:"
            ls -la allure/results/history | head -n 20
          else
            echo "No previous history found (first run)."
          fi

      - name: Install Allure CLI
        run: |
          ALLURE_VERSION=2.32.0
          curl -sSL -o /tmp/allure.tgz \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          sudo tar -zxf /tmp/allure.tgz -C /opt
          sudo ln -sf /opt/allure-${ALLURE_VERSION}/bin/allure /usr/local/bin/allure
          allure --version

      # ---------- Генерация отчёта ----------
      - name: Generate Allure report
        run: |
          ANY=0
          for d in allure/results/unit allure/results/integration allure/results/e2e; do
            if [ -d "$d" ] && [ "$(ls -A "$d" 2>/dev/null | grep -v '^history$')" ]; then
              ANY=1
            fi
          done
          if [ "$ANY" = "0" ]; then
            mkdir -p allure/results/unit
            printf 'No test results were produced.\n' > allure/results/unit/placeholder.txt
          fi
          echo "=== allure/results tree ==="
          find allure/results -type f | sort
          echo ""
          echo "=== Count of Allure JSON files per module ==="
          for d in allure/results/unit allure/results/integration allure/results/e2e; do
            echo "$d: $(ls -1 "$d"/*.json 2>/dev/null | wc -l) JSON files"
          done
          echo ""
          echo "=== Generating report ==="
          allure generate allure/results -o allure/report --clean
          echo ""
          echo "=== allure/report tree ==="
          find allure/report -maxdepth 2 -type f | head -50
          echo ""
          echo "=== test-cases count ==="
          ls -1 allure/report/data/test-cases/ 2>/dev/null | wc -l
          echo ""
          echo "=== index.html size ==="
          wc -c allure/report/index.html

      # ---------- Merge coverage ----------
      - name: Merge coverage reports
        if: always()
        run: |
          go install github.com/wadey/gocovmerge@latest
          FILES=""
          for f in coverage/coverage-unit.out coverage/coverage-integration.out coverage/coverage-e2e.out; do
            if [ -s "$f" ]; then FILES="$FILES $f"; fi
          done
          if [ -n "$FILES" ]; then
            echo "Merging:$FILES"
            gocovmerge $FILES > coverage/coverage.out
            echo "=== Merged coverage summary ==="
            go tool cover -func=coverage/coverage.out | tail -n 1
          else
            echo "!! No coverage files found to merge"
          fi

      - name: Upload merged coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-merged
          path: coverage/coverage.out
          retention-days: 14
          if-no-files-found: warn

      - name: Save Allure history for next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-history
          path: allure/report/history/
          retention-days: 7
          if-no-files-found: warn

      # ---------- Деплой ----------
      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure/report
          force_orphan: true
          enable_jekyll: false
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Allure report: run #${{ github.run_number }}"

      - name: Fail workflow if any test stage failed
        if: always()
        run: |
          echo "Unit:        ${{ needs.unit-tests.result }}"
          echo "Integration: ${{ needs.integration-tests.result }}"
          echo "E2E:         ${{ needs.e2e-tests.result }}"
          if [ "${{ needs.unit-tests.result }}" = "failure" ] || \
             [ "${{ needs.integration-tests.result }}" = "failure" ] || \
             [ "${{ needs.e2e-tests.result }}" = "failure" ]; then
            echo "::error::One or more test stages failed."
            exit 1
          fi
