name: GeoGuide Test Pipeline

on:
  push:
    branches: [main, master, develop, maib]
  pull_request:
    branches: [main, master, develop, maib]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-report:
    name: Unit -> Integration -> E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Prepare output dirs
        run: |
          mkdir -p allure-results allure-history coverage
          ls -la

      - name: Restore Allure history cache
        if: always()
        uses: actions/cache@v4
        with:
          path: allure-history/history
          key: allure-history-${{ github.ref }}-${{ github.run_number }}
          restore-keys: |
            allure-history-${{ github.ref }}-
            allure-history-

      - name: Run tests (docker-compose.ci.yml)
        id: tests
        continue-on-error: true
        run: make test-ci

      - name: Install Allure CLI
        if: always()
        run: |
          ALLURE_VERSION=2.32.0
          curl -sSL -o /tmp/allure.tgz "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          sudo tar -zxf /tmp/allure.tgz -C /opt
          sudo ln -sf /opt/allure-${ALLURE_VERSION}/bin/allure /usr/local/bin/allure
          allure --version

      - name: Merge old history into current results
        if: always()
        run: |
          mkdir -p allure-results
          if [ -d allure-history/history ]; then
            echo "Restoring history from cache..."
            cp -r allure-history/history allure-results/history
          else
            echo "No previous history found, first run."
          fi
          echo "--- allure-results contents ---"
          ls -la allure-results || true

      - name: Generate Allure report
        if: always()
        run: |
          if [ -z "$(ls -A allure-results 2>/dev/null | grep -v '^history$')" ]; then
            echo "No test results found. Creating placeholder..."
            mkdir -p allure-results
            printf 'No test results were produced. Tests may have failed before producing output.\n' > allure-results/placeholder.txt
          fi

          allure generate allure-results -o allure-report --clean

          mkdir -p allure-history
          rm -rf allure-history/history
          cp -r allure-report/history allure-history/history

          echo "--- allure-report contents ---"
          ls -la allure-report

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-raw
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Allure report: run #${{ github.run_number }}"

      - name: Fail job if tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Tests failed. Check the Allure report artifact or gh-pages branch."
          exit 1
