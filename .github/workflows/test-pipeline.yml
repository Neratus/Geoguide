name: GeoGuide Test Pipeline

on:
  push:
    branches: [main, master, develop, maib]
  pull_request:
    branches: [main, master, develop, maib]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-unit-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-unit-

      - name: Run Unit Tests & Generate Allure/JUnit
        id: unit
        continue-on-error: true
        run: |
          mkdir -p allure-results coverage
          make test-unit 
          # go test -v ./... | go-junit-report > allure-results/junit-unit.xml

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-unit
          path: allure-results/
          retention-days: 1
          if-no-files-found: ignore

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Integration Tests (Docker)
        id: integration
        continue-on-error: true
        run: |
          mkdir -p allure-results coverage
          make test-ci

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-integration
          path: allure-results/
          retention-days: 1
          if-no-files-found: ignore

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run E2E Tests
        id: e2e
        continue-on-error: true
        run: |
          mkdir -p allure-results coverage
          make test-e2e || echo "E2E tests skipped or failed"

      - name: Upload E2E Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e
          path: allure-results/
          retention-days: 1
          if-no-files-found: ignore

  report-and-deploy:
    name: Generate Allure Report & Deploy
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]
    if: always()
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download ALL Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: Download previous Allure history
        uses: actions/download-artifact@v4
        with:
          name: allure-history
          path: allure-history
        continue-on-error: true

      - name: Merge history into current results
        run: |
          mkdir -p allure-results
          if [ -d "allure-history/history" ]; then
            echo "Restoring history from previous run..."
            cp -r allure-history/history allure-results/history
          else
            echo "No previous history found, first run."
          fi

      - name: Install Allure CLI
        run: |
          ALLURE_VERSION=2.32.0
          curl -sSL -o /tmp/allure.tgz "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          sudo tar -zxf /tmp/allure.tgz -C /opt
          sudo ln -sf /opt/allure-${ALLURE_VERSION}/bin/allure /usr/local/bin/allure
          allure --version

      - name: Generate Allure report
        run: |
          if [ -z "$(ls -A allure-results 2>/dev/null | grep -v '^history$')" ]; then
            echo "No test results found. Creating placeholder..."
            printf 'No test results were produced.\n' > allure-results/placeholder.txt
          fi
          allure generate allure-results -o allure-report --clean

      - name: Save Allure history for next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-history
          path: allure-report/history/
          retention-days: 7
          if-no-files-found: ignore

      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Allure report: run #${{ github.run_number }}"

      - name: Fail job if any test stage failed
        run: |
          if [ "${{ needs.unit-tests.result }}" == "failure" ] || \
             [ "${{ needs.integration-tests.result }}" == "failure" ] || \
             [ "${{ needs.e2e-tests.result }}" == "failure" ]; then
            echo "::error::One or more test stages failed. Check the logs above."
            exit 1
          fi
